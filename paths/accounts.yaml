get:
  tags:
    - Accounts
  summary: List user accounts
  description: >
    Returns all financial accounts for the authenticated user, ordered by
    creation date descending.
  operationId: listAccounts
  parameters:
    - name: token
      in: query
      required: false
      description: >
        Opaque pagination cursor returned in `paging.nextToken` or
        `paging.previousToken` from a previous response. Omit to fetch
        the first page.
      schema:
        type: string
    - name: size
      in: query
      required: false
      description: Number of accounts per page. Capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Accounts retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/accounts/AccountListResponse.yaml'
          example:
            data:
              - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                accountName: HDFC Savings
                accountType: SAVINGS
                currentBalance: 25000.00
                balanceSource: MANUAL
                lastSyncedAt: null
                createdAt: '2026-06-07T10:30:00Z'
            paging:
              currentToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTA3VDEwOjMwOjAwWiIsImlkIjoiN2M5ZTY2NzkifQ==
              nextToken: null
              previousToken: null
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

post:
  tags:
    - Accounts
  summary: Create a user account
  description: >
    Links a financial account to the authenticated user. The account starts
    with the provided balance (or no balance if omitted) and the given account type.
  operationId: createAccount
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/accounts/CreateAccountRequest.yaml'
        example:
          accountName: HDFC Savings
          accountType: SAVINGS
          currentBalance: 25000.00
          balanceSource: MANUAL
  responses:
    '201':
      description: Account created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/accounts/AccountResponse.yaml'
          example:
            id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            accountName: HDFC Savings
            accountType: SAVINGS
            currentBalance: 25000.00
            balanceSource: MANUAL
            lastSyncedAt: null
            createdAt: '2026-06-07T10:30:00Z'
    '400':
      description: Validation error — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: accountName must not be blank
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

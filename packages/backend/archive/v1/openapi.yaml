openapi: 3.0.3
info:
  title: Silver Backend Service
  version: 0.0.1
  description: |
    API documentation for the Silver Backend Service

    **ARCHIVED:** This is a read-only historical snapshot of the v1 API. It will not receive further updates. Please refer to the current API documentation for the latest specification and endpoints.
  license:
    name: Proprietary - All Rights Reserved
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and OTP flows
  - name: Users
    description: User account management
  - name: Accounts
    description: User financial accounts management
  - name: Goals
    description: Saving goals management
  - name: Budgets
    description: Spending budgets management
  - name: Icons
    description: Curated icon catalog for budgets and saving goals
  - name: Transactions
    description: User credit and debit transaction recording
  - name: Scheduler
    description: On-demand goal allocation schedule execution
  - name: Notifications
    description: Push notification device token registration
paths:
  /api/v1/users:
    post:
      tags:
        - Users
      summary: Create a user account
      description: |
        Provisions a user account for the authenticated phone number. The phone number is extracted from the JWT token issued after OTP verification. Returns 409 if an account already exists for that number.
      operationId: createUser
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              timezone: Asia/Kolkata
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                phoneNumber: '+919876543210'
                active: true
                createdAt: '2026-06-04T10:30:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '409':
          description: Conflict — account already exists for this phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                error: Conflict
                message: An account already exists for this phone number
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: |
        Returns the profile of the authenticated user. The user is identified by the JWT bearer token.
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                phoneNumber: '+919876543210'
                active: true
                firstName: Alokit
                lastName: Jindal
                email: user@example.com
                timezone: Asia/Kolkata
                pushNotificationsEnabled: true
                createdAt: '2026-06-04T10:30:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: User account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: User not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags:
        - Users
      summary: Update current user profile
      description: |
        Partially updates the profile of the authenticated user. Only fields included in the request body are updated; omitted fields retain their current values. The user is identified by the JWT bearer token. `phoneNumber`, `active`, and `createdAt` are immutable and cannot be changed through this endpoint.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              firstName: Alokit
              lastName: Jindal
              email: user@example.com
              timezone: Asia/Kolkata
              pushNotificationsEnabled: true
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                phoneNumber: '+919876543210'
                active: true
                firstName: Alokit
                lastName: Jindal
                email: user@example.com
                timezone: Asia/Kolkata
                pushNotificationsEnabled: true
                createdAt: '2026-06-04T10:30:00Z'
        '400':
          description: Validation error — invalid field values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                message: email must be a valid email address
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: User account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: User not found
        '409':
          description: Conflict — email address is already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                error: Conflict
                message: Email address is already in use
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/accounts:
    get:
      tags:
        - Accounts
      summary: List user accounts
      description: |
        Returns all financial accounts for the authenticated user, ordered by creation date descending.
      operationId: listAccounts
      parameters:
        - name: token
          in: query
          required: false
          description: |
            Opaque pagination cursor returned in `paging.nextToken` or `paging.previousToken` from a previous response. Omit to fetch the first page.
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Number of accounts per page. Capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
              example:
                data:
                  - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    accountName: HDFC Savings
                    accountType: SAVINGS
                    currentBalance: 25000
                    balanceSource: MANUAL
                    lastSyncedAt: null
                    createdAt: '2026-06-07T10:30:00Z'
                paging:
                  currentToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTA3VDEwOjMwOjAwWiIsImlkIjoiN2M5ZTY2NzkifQ==
                  nextToken: null
                  previousToken: null
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Accounts
      summary: Create a user account
      description: |
        Links a financial account to the authenticated user. The account starts with the provided balance (or no balance if omitted) and the given account type.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              accountName: HDFC Savings
              accountType: SAVINGS
              currentBalance: 25000
              balanceSource: MANUAL
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                accountName: HDFC Savings
                accountType: SAVINGS
                currentBalance: 25000
                balanceSource: MANUAL
                lastSyncedAt: null
                createdAt: '2026-06-07T10:30:00Z'
        '400':
          description: Validation error — missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                message: accountName must not be blank
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get an account by ID
      description: |
        Returns a single financial account by its ID. Returns 404 if the account does not exist or does not belong to the authenticated user.
      operationId: getAccountById
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier of the financial account
          schema:
            type: string
            format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '200':
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                accountName: HDFC Savings
                accountType: SAVINGS
                currentBalance: 25000
                balanceSource: MANUAL
                lastSyncedAt: null
                createdAt: '2026-06-07T10:30:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Account not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: Account not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags:
        - Accounts
      summary: Update an account by ID
      description: |
        Partially updates a financial account. Only fields included in the request body are updated. Returns 404 if the account does not exist or does not belong to the authenticated user.
      operationId: updateAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier of the financial account
          schema:
            type: string
            format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            example:
              accountName: HDFC Savings
              currentBalance: 30000
              balanceSource: MANUAL
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                accountName: HDFC Savings
                accountType: SAVINGS
                currentBalance: 30000
                balanceSource: MANUAL
                lastSyncedAt: null
                createdAt: '2026-06-07T10:30:00Z'
        '400':
          description: Validation error — invalid field values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                message: currentBalance must be greater than or equal to 0
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Account not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: Account not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/goals:
    get:
      tags:
        - Goals
      summary: List saving goals
      description: |
        Returns all saving goals for the authenticated user, ordered by creation date descending. Optionally filter by status.
      operationId: listGoals
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            Filter expression supporting comparison and logical operators.

            **Grammar**
            ```
            expr       = term ( ("and" | "or") term )*
            term       = field operator value | "(" expr ")"
            operator   = "eq" | "neq"
            field      = "status" | "currency"
            value      = bare word (no quotes)
            ```
            Operator precedence follows standard rules — `and` binds tighter than `or`. Use parentheses to override.

            **Supported fields**
            | Field      | Type   | Allowed values                        |
            |------------|--------|---------------------------------------|
            | `status`   | enum   | `ACTIVE`, `COMPLETED`, `CANCELLED`    |
            | `currency` | string | ISO 4217 code, e.g. `INR`, `USD`     |

            **Examples**
            - `status eq ACTIVE`
            - `status neq CANCELLED`
            - `status eq ACTIVE and currency eq INR`
            - `status eq ACTIVE or status eq COMPLETED`
            - `(status eq ACTIVE or status eq COMPLETED) and currency eq INR`
          schema:
            type: string
          example: status eq ACTIVE and currency eq INR
        - name: token
          in: query
          required: false
          description: |
            Opaque pagination cursor returned in `paging.nextToken` or `paging.previousToken` from a previous response. Omit to fetch the first page.
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Number of goals per page. Capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Goals retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalListResponse'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    name: Emergency Fund
                    targetAmount: 50000
                    currentAmount: 12000
                    currency: INR
                    targetDate: '2026-12-31'
                    notes: 6 months of living expenses
                    status: ACTIVE
                    createdAt: '2026-06-04T10:30:00Z'
                paging:
                  currentToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTA0VDEwOjMwOjAwWiIsImlkIjoiM2ZhODVmNjQifQ==
                  nextToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA1LTAxVDA4OjAwOjAwWiIsImlkIjoiOWFiMTJjMzQifQ==
                  previousToken: null
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                message: 'Invalid filter expression: unexpected token ''ACTIVE'' at position 10'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Goals
      summary: Create a new saving goal
      description: |
        Creates a saving goal for the authenticated user. The goal starts with a current amount of zero and a status of ACTIVE.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
            example:
              name: Emergency Fund
              targetAmount: 50000
              currency: INR
              targetDate: '2026-12-31'
              notes: 6 months of living expenses
      responses:
        '201':
          description: Goal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: Emergency Fund
                targetAmount: 50000
                currentAmount: 0
                currency: INR
                targetDate: '2026-12-31'
                notes: 6 months of living expenses
                status: ACTIVE
                createdAt: '2026-06-04T10:30:00Z'
        '400':
          description: Validation error — missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                message: targetAmount must be greater than or equal to 1
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/goals/{goalId}:
    get:
      tags:
        - Goals
      summary: Get a saving goal by ID
      description: |
        Returns a single saving goal by its ID. Returns 404 if the goal does not exist or does not belong to the authenticated user.
      operationId: getGoalById
      parameters:
        - name: goalId
          in: path
          required: true
          description: Unique identifier of the saving goal
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Goal retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: Emergency Fund
                targetAmount: 50000
                currentAmount: 12000
                currency: INR
                targetDate: '2026-12-31'
                notes: 6 months of living expenses
                status: ACTIVE
                createdAt: '2026-06-04T10:30:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Goal not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: Goal not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags:
        - Goals
      summary: Delete a saving goal
      description: |
        Permanently deletes a saving goal. Returns 404 if the goal does not exist or does not belong to the authenticated user.
      operationId: deleteGoal
      parameters:
        - name: goalId
          in: path
          required: true
          description: Unique identifier of the saving goal
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '204':
          description: Goal deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Goal not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: Goal not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags:
        - Goals
      summary: Update a saving goal
      description: |
        Partially updates a saving goal. Only fields included in the request body are updated. Returns 404 if the goal does not exist or does not belong to the authenticated user.
      operationId: updateGoal
      parameters:
        - name: goalId
          in: path
          required: true
          description: Unique identifier of the saving goal
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
      responses:
        '200':
          description: Goal updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Goal not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: Goal not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/goals/order:
    put:
      tags:
        - Goals
      summary: Reorder saving goals
      description: |
        Replaces the display order of all saving goals for the authenticated user in a single atomic operation. The request must include every goal owned by the user — partial lists are rejected with 400.

        **Constraints**
        - `orderings` must contain exactly one entry per goal owned by the user.
        - `order` values within the list must be unique non-negative integers.
        - Goals belonging to other users are ignored if accidentally included and
          will not cause an error; only the caller's goals are updated.
      operationId: reorderGoals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalOrderRequest'
            example:
              orderings:
                - goalId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  order: 0
                - goalId: 7bc91a23-1234-4abc-9def-4d8e7f123456
                  order: 1
                - goalId: a1b2c3d4-5678-4ef0-abcd-ef1234567890
                  order: 2
      responses:
        '204':
          description: Goals reordered successfully
        '400':
          description: |
            Validation error — missing goals, duplicate order values, or malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingGoals:
                  summary: Orderings list does not cover all user goals
                  value:
                    status: 400
                    error: Bad Request
                    message: Orderings must include all 3 goals; got 2
                duplicateOrder:
                  summary: Duplicate order values in the list
                  value:
                    status: 400
                    error: Bad Request
                    message: 'Duplicate order value: 1'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/goals/{goalId}/transactions:
    get:
      tags:
        - Goals
      summary: List transactions for a saving goal
      description: |
        Returns a paginated list of allocation transactions recorded against a saving goal, ordered by creation date descending. Returns 404 if the goal does not exist or does not belong to the authenticated user.
      operationId: listGoalTransactions
      parameters:
        - name: goalId
          in: path
          required: true
          description: Unique identifier of the saving goal
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        - name: token
          in: query
          required: false
          description: |
            Opaque pagination cursor returned in `paging.nextToken` or `paging.previousToken` from a previous response. Omit to fetch the first page.
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Number of transactions per page. Capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalTransactionListResponse'
              example:
                data:
                  - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    amount: 5000
                    transactionType: DEPOSIT
                    createdAt: '2026-06-13T09:15:00Z'
                  - id: 1a2b3c4d-5e6f-7890-abcd-ef1234567890
                    amount: 1000
                    transactionType: WITHDRAWAL
                    createdAt: '2026-06-10T14:30:00Z'
                paging:
                  currentToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTEzVDA5OjE1OjAwWiIsImlkIjoiN2M5ZTY2NzkifQ==
                  nextToken: null
                  previousToken: null
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          description: Goal not found or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                error: Not Found
                message: Goal not found
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /api/v1/budgets:
    get:
      tags:
        - Budgets
      summary: List budgets
      description: |
        Returns all budgets for the authenticated user, ordered by creation date descending. Optionally filter using a structured filter expression.
      operationId: listBudgets
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            Filter expression supporting comparison and logical operators.

            **Grammar**
            ```
            expr       = term ( ("and" | "or") term )*
            term       = field operator value | "(" expr ")"
            operator   = "eq" | "neq"
            field      = "status" | "periodType"
            value      = bare word (no quotes)
            ```
            Operator precedence follows standard rules — `and` binds tighter than `or`. Use parentheses to override.

            **Supported fields**
            | Field        | Type    | Allowed values                    |
            |--------------|---------|------------------------------------|
            | `status`     | enum    | `ACTIVE`, `INACTIVE`, `ARCHIVED`  |
            | `periodType` | enum    | `WEEKLY`, `MONTHLY`, `YEARLY`     |

            **Examples**
            - `status eq ACTIVE`
            - `periodType eq MONTHLY`
            - `status eq ACTIVE and periodType eq MONTHLY`
            - `periodType eq WEEKLY or periodType eq MONTHLY`
          schema:
            type: string
          example: status eq ACTIVE and periodType eq MONTHLY
        - name: token
          in: query
          required: false
          description: |
            Opaque pagination cursor returned in `paging.nextToken` or `paging.previousToken` from a previous response. Omit to fetch the first page.
          schema:
            type: string
        - name: size
          in: query

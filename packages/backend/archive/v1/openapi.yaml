          example: INR
        schedulePeriodType:
          $ref: '#/components/schemas/SchedulePeriodType'
        startDate:
          type: string
          format: date
          nullable: true
          description: Date the recurring schedule's first reminder was anchored to, if set
          example: '2026-08-01'
        enabled:
          type: boolean
          description: Whether this recurring rule is currently sending reminders
          example: true
        nextExecutionAt:
          type: string
          format: date-time
          description: When the next reminder for this rule is due
          example: '2026-08-01T00:00:00Z'
    RecurringTransactionRuleListResponse:
      allOf:
        - $ref: '#/components/schemas/PagedResponse'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RecurringTransactionRuleResponse'
              description: Recurring transaction rules on the current page, ordered by creation date descending
    UpdateRecurringTransactionRuleRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the recurring rule should keep sending reminders
          example: false
    ReceiptUploadUrlRequest:
      type: object
      required:
        - contentType
        - contentLength
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
          description: |
            MIME type of the image about to be uploaded. Signed into the presigned URL, so an upload declaring a different `Content-Type` is rejected by the storage service.
          example: image/jpeg
        contentLength:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: |
            Exact size in bytes of the image about to be uploaded. Also signed into the presigned URL, so a client cannot declare a small image and then stream a large one. Capped at 10 MB.
          example: 248312
    ReceiptUploadUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          description: |
            Short-lived presigned URL. The client uploads the image by issuing a plain `PUT` to this URL with the declared `Content-Type` and no Authorization header — the credentials are already embedded in the query string.
          example: https://silver-receipts-dev.s3.ap-south-1.amazonaws.com/pending/7c9e6679-7425-40de-944b-e07fc1f90ae7/3f1c2d49-1b74-e5ab-c348-f72e1d09abcd.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256
        objectKey:
          type: string
          maxLength: 255
          description: |
            Server-generated storage key the upload targets. Send this value back as `receiptKey` when creating or updating the transaction. Clients never choose this key — it is derived from the authenticated user.
          example: pending/7c9e6679-7425-40de-944b-e07fc1f90ae7/3f1c2d49-1b74-e5ab-c348-f72e1d09abcd.jpg
        expiresAt:
          type: string
          format: date-time
          description: Timestamp after which the presigned URL is no longer valid.
          example: '2026-08-22T07:45:00Z'
    DevicePlatform:
      type: string
      enum:
        - IOS
        - ANDROID
      description: Mobile OS platform the device token was issued for
      example: IOS
    RegisterDeviceTokenRequest:
      type: object
      required:
        - expoPushToken
        - platform
      properties:
        expoPushToken:
          type: string
          minLength: 1
          maxLength: 255
          description: Expo push token obtained from `Notifications.getExpoPushTokenAsync()` on the device
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DeviceTokenResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the registered device token
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        active:
          type: boolean
          description: Whether this device token is currently active and eligible to receive pushes
          example: true
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the device token was first registered
          example: '2026-06-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the device token was last refreshed
          example: '2026-06-07T10:30:00Z'
    TriggerType:
      type: string
      description: Category of event that fires a goal allocation rule
      enum:
        - SCHEDULED
        - INCOME_RECEIVED
        - MANUAL
      example: SCHEDULED
  responses:
    UnauthorizedResponse:
      description: Unauthorized — missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error: Unauthorized
            message: Full authentication is required to access this resource
    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error: Internal Server Error
            message: An unexpected error occurred
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

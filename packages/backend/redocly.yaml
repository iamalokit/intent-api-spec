# Redocly 1.x errors out with "No rules were configured" unless a ruleset is
# declared here, so CI and local runs both depend on this being set.
extends:
  - recommended

apis:
  silver-api@v1:
    root: ./openapi.yaml

theme:
  openapi:
    showConsole: true
    generateCodeSamples:
      languages:
        - lang: curl
        - lang: JavaScript
        - lang: Java

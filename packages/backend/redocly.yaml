# Redocly 1.x errors out with "No rules were configured" unless a ruleset is
# declared here, so CI and local runs both depend on this being set.
extends:
  - recommended

rules:
  # The only running instance today is the local backend on :8080; there is no
  # deployed host to point at yet. Re-enable once one exists.
  no-server-example.com: off

  # The license is proprietary, so there is no public license document to link.
  # `info-license` (name required) stays on; only the url check is dropped.
  info-license-strict: off

apis:
  silver-api@v1:
    root: ./openapi.yaml

theme:
  openapi:
    showConsole: true
    generateCodeSamples:
      languages:
        - lang: curl
        - lang: JavaScript
        - lang: Java

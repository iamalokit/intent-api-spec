post:
  tags:
    - Budgets
  summary: Create a new budget
  description: >
    Creates a spending budget for the authenticated user. The budget starts
    active and applies from `startDate` for each recurring `periodType` period.
  operationId: createBudget
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/budgets/CreateBudgetRequest.yaml'
        example:
          name: Groceries
          periodType: MONTHLY
          amount: 10000.00
          startDate: '2026-06-01'
  responses:
    '201':
      description: Budget created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/budgets/BudgetResponse.yaml'
          example:
            id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            name: Groceries
            periodType: MONTHLY
            amount: 10000.00
            startDate: '2026-06-01'
            isActive: true
            createdAt: '2026-06-14T09:00:00Z'
            updatedAt: '2026-06-14T09:00:00Z'
    '400':
      description: Validation error — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: amount must be greater than or equal to 1
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

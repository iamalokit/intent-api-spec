post:
  tags:
    - Budgets
  summary: Add a transaction to a budget category
  description: >
    Records a new transaction categorised under the specified budget.
    The budget ID is taken from the path — do not include it in the request body.
    Currency defaults to `INR` if not provided.
    Returns 404 if the budget does not exist or does not belong to the authenticated user.
    Returns 409 if the budget is archived.
  operationId: createBudgetTransaction
  parameters:
    - name: budgetId
      in: path
      required: true
      description: Unique identifier of the budget category
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    - $ref: '../components/parameters/IdempotencyKeyHeader.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/budgets/CreateBudgetTransactionRequest.yaml'
        example:
          accountId: a1b2c3d4-5678-90ab-cdef-1234567890ab
          type: DEBIT
          title: Grocery run
          amount: '1500.00'
          currency: INR
          description: Monthly grocery shopping
  responses:
    '201':
      description: Transaction recorded successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/transactions/TransactionResponse.yaml'
          example:
            id: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
            accountId: a1b2c3d4-5678-90ab-cdef-1234567890ab
            budgetId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            type: DEBIT
            amount: '1500.00'
            currency: INR
            title: Grocery run
            description: Monthly grocery shopping
            createdAt: '2026-06-26T10:30:00Z'
            updatedAt: '2026-06-26T10:30:00Z'
            recurringRule:
              id: 9c1e6679-7425-40de-944b-e07fc1f90ae8
              accountId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              budgetId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              title: Netflix subscription
              description: Monthly streaming subscription
              type: DEBIT
              amount: '649.00'
              currency: INR
              schedulePeriodType: MONTHLY
              startDate: '2026-08-01'
              enabled: true
              nextExecutionAt: '2026-08-01T00:00:00Z'
            receiptKey: null
            receiptUrl: null
    '400':
      description: Validation error — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ValidationErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: amount must be greater than or equal to 0.01
            code: VALIDATION_ERROR
            traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            errors:
              - field: amount
                message: must be greater than or equal to 0.01
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '404':
      description: Budget or account not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          examples:
            budgetNotFound:
              summary: Budget does not exist or does not belong to the authenticated user
              value:
                status: 404
                error: Not Found
                message: Budget not found
                code: BUDGET_NOT_FOUND
                traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            accountNotFound:
              summary: Account does not exist or does not belong to the authenticated user
              value:
                status: 404
                error: Not Found
                message: Account not found
                code: ACCOUNT_NOT_FOUND
                traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    '409':
      description: Conflict — the budget is archived and read-only, or the Idempotency-Key was reused with a different request body
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          examples:
            budgetArchivedConflict:
              summary: The budget is archived and read-only
              value:
                status: 409
                error: Conflict
                message: Archived budgets are read-only; unarchive it first
                code: BUDGET_ARCHIVED_CONFLICT
                traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            idempotencyKeyReuse:
              summary: Idempotency-Key was reused with a different request body
              value:
                status: 409
                error: Conflict
                message: This Idempotency-Key was already used with a different request body
                code: IDEMPOTENCY_KEY_REUSE
                traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    '429':
      $ref: '../components/responses/RateLimitExceededResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

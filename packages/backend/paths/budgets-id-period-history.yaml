get:
  tags:
    - Budgets
  summary: List a budget's closed period history
  description: >
    Returns per-period snapshots for a MONTHLY budget's closed periods
    (budgeted amount, carryover in/out, spend during the period, and any
    late-posted spend recorded after the period closed), ordered by
    closedAt descending. Returns 404 if the budget does not exist or does
    not belong to the authenticated user.
  operationId: listBudgetPeriodHistory
  parameters:
    - name: budgetId
      in: path
      required: true
      description: Unique identifier of the budget
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    - name: token
      in: query
      required: false
      description: >
        Opaque pagination cursor returned in `paging.nextToken` or
        `paging.previousToken` from a previous response. Omit to fetch
        the first page.
      schema:
        type: string
    - name: size
      in: query
      required: false
      description: Number of entries per page. Capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Period history retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/budgets/BudgetPeriodHistoryListResponse.yaml'
          example:
            data:
              - id: 3b241101-e2bb-4255-8caf-4136c566a962
                budgetId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                periodStart: '2026-05-01'
                periodEnd: '2026-06-01'
                budgetedAmount: 12000.00
                carryoverIn: 2000.00
                spentDuringPeriod: 9500.00
                carryoverOut: 2500.00
                lateSpentAmount: 350.00
                closedAt: '2026-06-01T00:00:00Z'
            paging:
              currentToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTAxVDAwOjAwOjAwWiIsImlkIjoiM2IyNDExMDEifQ==
              nextToken: null
              previousToken: null
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '404':
      description: Budget not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 404
            error: Not Found
            message: Budget not found
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

get:
  tags:
    - Transactions
  summary: Get a transaction by ID
  description: >
    Returns a single transaction by its ID. Returns 404 if the transaction
    does not exist or does not belong to the authenticated user.
  operationId: getTransactionById
  parameters:
    - name: transactionId
      in: path
      required: true
      description: Unique identifier of the transaction
      schema:
        type: string
        format: uuid
      example: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
  responses:
    '200':
      description: Transaction retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/transactions/TransactionResponse.yaml'
          example:
            id: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
            type: DEBIT
            amount: 1500.00
            currency: INR
            description: Monthly grocery shopping
            createdAt: '2026-06-19T10:30:00Z'
            updatedAt: '2026-06-19T10:30:00Z'
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '404':
      description: Transaction not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 404
            error: Not Found
            message: Transaction not found
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

put:
  tags:
    - Transactions
  summary: Update a transaction by ID
  description: >
    Partially updates a transaction. Only `accountId`, `amount`, and `description`
    can be updated — `type` and `currency` are immutable after creation. Only fields
    included in the request body are applied. Returns 404 if the transaction
    does not exist or does not belong to the authenticated user.
  operationId: updateTransaction
  parameters:
    - name: transactionId
      in: path
      required: true
      description: Unique identifier of the transaction
      schema:
        type: string
        format: uuid
      example: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/transactions/UpdateTransactionRequest.yaml'
        example:
          accountId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          amount: 2000.00
          description: Monthly grocery shopping — corrected
  responses:
    '200':
      description: Transaction updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/transactions/TransactionResponse.yaml'
          example:
            id: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
            accountId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            type: DEBIT
            amount: 2000.00
            currency: INR
            description: Monthly grocery shopping — corrected
            createdAt: '2026-06-19T10:30:00Z'
            updatedAt: '2026-06-20T08:15:00Z'
    '400':
      description: Validation error — invalid field values
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: amount must be greater than or equal to 0.01
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '404':
      description: Transaction not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 404
            error: Not Found
            message: Transaction not found
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

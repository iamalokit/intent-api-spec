post:
  tags:
    - Transactions
  summary: Record a new transaction
  description: >
    Records a credit or debit transaction for the authenticated user.
    Currency defaults to `INR` if not provided.
  operationId: createTransaction
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/transactions/CreateTransactionRequest.yaml'
        example:
          type: DEBIT
          amount: 1500.00
          currency: INR
          description: Monthly grocery shopping
  responses:
    '201':
      description: Transaction recorded successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/transactions/TransactionResponse.yaml'
          example:
            id: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
            type: DEBIT
            amount: 1500.00
            currency: INR
            description: Monthly grocery shopping
            createdAt: '2026-06-19T10:30:00Z'
            updatedAt: '2026-06-19T10:30:00Z'
    '400':
      description: Validation error — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: amount must be greater than or equal to 0.01
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

get:
  tags:
    - Budgets
  summary: Get a budget by ID
  description: >
    Returns a single budget by its ID. Returns 404 if the budget does not
    exist or does not belong to the authenticated user.
  operationId: getBudgetById
  parameters:
    - name: budgetId
      in: path
      required: true
      description: Unique identifier of the budget
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  responses:
    '200':
      description: Budget retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/budgets/BudgetResponse.yaml'
          example:
            id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            name: Groceries
            periodType: MONTHLY
            amount: '10000.00'
            startDate: '2026-06-01'
            currency: INR
            status: ACTIVE
            carryoverPolicy: CARRY_OVER
            carryoverAmount: '2000.00'
            effectiveAmount: '12000.00'
            spentAmount: '3500.00'
            carryoverSpent: '1500.00'
            iconId: 99429136-66ff-4b98-9335-e8edce6e9a51
            createdAt: '2026-06-14T09:00:00Z'
            updatedAt: '2026-06-14T09:00:00Z'
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '404':
      description: Budget not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 404
            error: Not Found
            message: Budget not found
            code: BUDGET_NOT_FOUND
            traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    '429':
      $ref: '../components/responses/RateLimitExceededResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

put:
  tags:
    - Budgets
  summary: Update a budget
  description: >
    Updates an existing budget. Only fields included in the request body are
    updated; omitted fields retain their current values. Returns 404 if the
    budget does not exist or does not belong to the authenticated user.
    An archived budget is read-only: any request that changes a field other
    than `status` while the budget's current status is `ARCHIVED` (and the
    request does not itself move `status` away from `ARCHIVED`) returns 409.
  operationId: updateBudget
  parameters:
    - name: budgetId
      in: path
      required: true
      description: Unique identifier of the budget
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/budgets/UpdateBudgetRequest.yaml'
        example:
          name: Groceries & Dining
          amount: '12000.00'
          status: ACTIVE
  responses:
    '200':
      description: Budget updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/budgets/BudgetResponse.yaml'
          example:
            id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            name: Groceries & Dining
            periodType: MONTHLY
            amount: '12000.00'
            startDate: '2026-06-01'
            currency: INR
            status: ACTIVE
            carryoverPolicy: CARRY_OVER
            carryoverAmount: '2000.00'
            effectiveAmount: '12000.00'
            spentAmount: '3500.00'
            carryoverSpent: '1500.00'
            iconId: 99429136-66ff-4b98-9335-e8edce6e9a51
            createdAt: '2026-06-14T09:00:00Z'
            updatedAt: '2026-06-15T11:30:00Z'
    '400':
      description: Validation error — invalid field values
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ValidationErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: amount must be greater than or equal to 1
            code: VALIDATION_ERROR
            traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            errors:
              - field: amount
                message: must be greater than or equal to 1
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '404':
      description: Budget not found or does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 404
            error: Not Found
            message: Budget not found
            code: BUDGET_NOT_FOUND
            traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    '409':
      description: Conflict — the budget is archived and read-only
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 409
            error: Conflict
            message: Archived budgets are read-only; unarchive it first
            code: BUDGET_ARCHIVED_CONFLICT
            traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    '429':
      $ref: '../components/responses/RateLimitExceededResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

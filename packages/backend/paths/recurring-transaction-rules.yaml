get:
  tags:
    - Transactions
  summary: List recurring transaction rules
  description: >
    Returns a paginated list of recurring transaction rules for the
    authenticated user, ordered by creation date descending. Supports
    optional filtering via a structured filter string. Rules are created
    implicitly by attaching `recurringRule` to a transaction at creation
    time — there is no standalone create endpoint.
  operationId: listRecurringTransactionRules
  parameters:
    - name: filter
      in: query
      required: false
      description: >
        Filter expression supporting comparison and logical operators.


        **Grammar**

        ```

        expr       = term ( ("and" | "or") term )*

        term       = field operator value | "(" expr ")"

        operator   = "eq" | "neq"

        field      = "type" | "accountId" | "budgetId" | "enabled"

        value      = bare word (no quotes)

        ```

        Operator precedence follows standard rules — `and` binds tighter than `or`.
        Use parentheses to override.


        **Supported fields**

        | Field       | Type    | Allowed values          |

        |-------------|---------|--------------------------|

        | `type`      | enum    | `CREDIT`, `DEBIT`        |

        | `accountId` | UUID    | Valid UUID               |

        | `budgetId`  | UUID    | Valid UUID               |

        | `enabled`   | boolean | `true`, `false`          |


        **Examples**

        - `type eq DEBIT`

        - `enabled eq true`

        - `accountId eq 3fa85f64-5717-4562-b3fc-2c963f66afa6 and enabled eq true`
      schema:
        type: string
      example: type eq DEBIT and enabled eq true
    - name: token
      in: query
      required: false
      description: >
        Opaque pagination cursor returned in `paging.nextToken` or
        `paging.previousToken` from a previous response. Omit to fetch
        the first page.
      schema:
        type: string
    - name: size
      in: query
      required: false
      description: Number of recurring transaction rules per page. Capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Recurring transaction rules retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/transactions/RecurringTransactionRuleListResponse.yaml'
          example:
            data:
              - id: 9c1e6679-7425-40de-944b-e07fc1f90ae8
                accountId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                budgetId: null
                title: Netflix subscription
                description: Monthly streaming subscription
                type: DEBIT
                amount: 649.00
                currency: INR
                schedulePeriodType: MONTHLY
                startDate: '2026-08-01'
                enabled: true
                nextExecutionAt: '2026-09-01T00:00:00Z'
            paging:
              currentToken: eyJjcmVhdGVkQXQiOiIyMDI2LTA2LTA0VDEwOjMwOjAwWiIsImlkIjoiM2ZhODVmNjQifQ==
              nextToken: null
              previousToken: null
    '400':
      description: Invalid filter expression
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common/ErrorResponse.yaml'
          example:
            status: 400
            error: Bad Request
            message: "Invalid filter expression: unexpected token 'DEBIT' at position 10"
    '401':
      $ref: '../components/responses/UnauthorizedResponse.yaml'
    '500':
      $ref: '../components/responses/InternalServerErrorResponse.yaml'

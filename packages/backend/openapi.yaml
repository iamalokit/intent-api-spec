openapi: 3.0.3
info:
  title: Intent Backend Service
  version: 0.0.1
  description: API documentation for the Intent Backend Service

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Authentication and OTP flows
  - name: Users
    description: User account management
  - name: Accounts
    description: User financial accounts management
  - name: Goals
    description: Saving goals management
  - name: Budgets
    description: Spending budgets management
  - name: Transactions
    description: User credit and debit transaction recording

paths:
  /api/v1/users:
    $ref: './paths/users.yaml'
  /api/v1/users/me:
    $ref: './paths/users-me.yaml'
  /api/v1/accounts:
    $ref: './paths/accounts.yaml'
  /api/v1/accounts/{accountId}:
    $ref: './paths/accounts-id.yaml'
  /api/v1/goals:
    $ref: './paths/goals.yaml'
  /api/v1/goals/{goalId}:
    $ref: './paths/goals-id.yaml'
  /api/v1/goals/order:
    $ref: './paths/goals-order.yaml'
  /api/v1/goals/{goalId}/transactions:
    $ref: './paths/goals-id-transactions.yaml'
  /api/v1/budgets:
    $ref: './paths/budgets.yaml'
  /api/v1/budgets/{budgetId}:
    $ref: './paths/budgets-id.yaml'
  /api/v1/transactions:
    $ref: './paths/transactions.yaml'
  /api/v1/transactions/descriptions:
    $ref: './paths/transactions-descriptions.yaml'
  /api/v1/transactions/{transactionId}:
    $ref: './paths/transactions-id.yaml'
  /api/v1/auth/send-otp:
    $ref: './paths/auth/send-otp.yaml'
  /api/v1/auth/verify-otp:
    $ref: './paths/auth/verify-otp.yaml'

components:
  schemas:
    # Common — reusable across services
    ErrorResponse:
      $ref: './components/schemas/common/ErrorResponse.yaml'
    PageInfo:
      $ref: './components/schemas/common/PageInfo.yaml'
    PagedResponse:
      $ref: './components/schemas/common/PagedResponse.yaml'
    PhoneNumberRequest:
      $ref: './components/schemas/common/PhoneNumberRequest.yaml'
    # Auth
    SendOtpRequest:
      $ref: './components/schemas/auth/SendOtpRequest.yaml'
    SendOtpResponse:
      $ref: './components/schemas/auth/SendOtpResponse.yaml'
    VerifyOtpRequest:
      $ref: './components/schemas/auth/VerifyOtpRequest.yaml'
    VerifyOtpResponse:
      $ref: './components/schemas/auth/VerifyOtpResponse.yaml'
    # Users
    CreateUserRequest:
      $ref: './components/schemas/users/CreateUserRequest.yaml'
    UpdateUserRequest:
      $ref: './components/schemas/users/UpdateUserRequest.yaml'
    UserResponse:
      $ref: './components/schemas/users/UserResponse.yaml'
    # Accounts
    AccountType:
      $ref: './components/schemas/accounts/AccountType.yaml'
    CreateAccountRequest:
      $ref: './components/schemas/accounts/CreateAccountRequest.yaml'
    AccountResponse:
      $ref: './components/schemas/accounts/AccountResponse.yaml'
    AccountListResponse:
      $ref: './components/schemas/accounts/AccountListResponse.yaml'
    UpdateAccountRequest:
      $ref: './components/schemas/accounts/UpdateAccountRequest.yaml'
    # Goals
    GoalStatus:
      $ref: './components/schemas/goals/GoalStatus.yaml'
    CreateGoalRequest:
      $ref: './components/schemas/goals/CreateGoalRequest.yaml'
    GoalResponse:
      $ref: './components/schemas/goals/GoalResponse.yaml'
    GoalListResponse:
      $ref: './components/schemas/goals/GoalListResponse.yaml'
    UpdateGoalRequest:
      $ref: './components/schemas/goals/UpdateGoalRequest.yaml'
    GoalAllocationRuleRequest:
      $ref: './components/schemas/goals/GoalAllocationRuleRequest.yaml'
    GoalAllocationRuleResponse:
      $ref: './components/schemas/goals/GoalAllocationRuleResponse.yaml'
    UpdateGoalOrderRequest:
      $ref: './components/schemas/goals/UpdateGoalOrderRequest.yaml'
    GoalTransactionType:
      $ref: './components/schemas/goals/GoalTransactionType.yaml'
    GoalTransactionResponse:
      $ref: './components/schemas/goals/GoalTransactionResponse.yaml'
    GoalTransactionListResponse:
      $ref: './components/schemas/goals/GoalTransactionListResponse.yaml'
    # Budgets
    BudgetPeriodType:
      $ref: './components/schemas/budgets/BudgetPeriodType.yaml'
    CreateBudgetRequest:
      $ref: './components/schemas/budgets/CreateBudgetRequest.yaml'
    UpdateBudgetRequest:
      $ref: './components/schemas/budgets/UpdateBudgetRequest.yaml'
    BudgetResponse:
      $ref: './components/schemas/budgets/BudgetResponse.yaml'
    BudgetListResponse:
      $ref: './components/schemas/budgets/BudgetListResponse.yaml'
    # Transactions
    TransactionType:
      $ref: './components/schemas/transactions/TransactionType.yaml'
    CreateTransactionRequest:
      $ref: './components/schemas/transactions/CreateTransactionRequest.yaml'
    TransactionResponse:
      $ref: './components/schemas/transactions/TransactionResponse.yaml'
    TransactionListResponse:
      $ref: './components/schemas/transactions/TransactionListResponse.yaml'
    UpdateTransactionRequest:
      $ref: './components/schemas/transactions/UpdateTransactionRequest.yaml'
  responses:
    UnauthorizedResponse:
      $ref: './components/responses/UnauthorizedResponse.yaml'
    InternalServerErrorResponse:
      $ref: './components/responses/InternalServerErrorResponse.yaml'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

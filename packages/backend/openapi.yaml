openapi: 3.0.3
info:
  title: Silver Backend Service
  version: 0.0.1
  description: API documentation for the Silver Backend Service
  license:
    name: Proprietary - All Rights Reserved

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Authentication and OTP flows
  - name: Users
    description: User account management
  - name: Accounts
    description: User financial accounts management
  - name: Goals
    description: Saving goals management
  - name: Budgets
    description: Spending budgets management
  - name: Icons
    description: Curated icon catalog for budgets and saving goals
  - name: Transactions
    description: User credit and debit transaction recording
  - name: Scheduler
    description: On-demand goal allocation schedule execution
  - name: Notifications
    description: Push notification device token registration

paths:
  /api/v1/users:
    $ref: './paths/users.yaml'
  /api/v1/users/me:
    $ref: './paths/users-me.yaml'
  /api/v1/accounts:
    $ref: './paths/accounts.yaml'
  /api/v1/accounts/{accountId}:
    $ref: './paths/accounts-id.yaml'
  /api/v1/goals:
    $ref: './paths/goals.yaml'
  /api/v1/goals/{goalId}:
    $ref: './paths/goals-id.yaml'
  /api/v1/goals/order:
    $ref: './paths/goals-order.yaml'
  /api/v1/goals/{goalId}/transactions:
    $ref: './paths/goals-id-transactions.yaml'
  /api/v1/budgets:
    $ref: './paths/budgets.yaml'
  /api/v1/budgets/{budgetId}:
    $ref: './paths/budgets-id.yaml'
  /api/v1/budgets/{budgetId}/transactions:
    $ref: './paths/budgets-id-transactions.yaml'
  /api/v1/budgets/{budgetId}/audit-log:
    $ref: './paths/budgets-id-audit-log.yaml'
  /api/v1/budgets/{budgetId}/period-history:
    $ref: './paths/budgets-id-period-history.yaml'
  /api/v1/icons:
    $ref: './paths/icons.yaml'
  /api/v1/transactions:
    $ref: './paths/transactions.yaml'
  /api/v1/transactions/titles:
    $ref: './paths/transactions-titles.yaml'
  /api/v1/transactions/{transactionId}:
    $ref: './paths/transactions-id.yaml'
  /api/v1/recurring-transaction-rules:
    $ref: './paths/recurring-transaction-rules.yaml'
  /api/v1/recurring-transaction-rules/{ruleId}:
    $ref: './paths/recurring-transaction-rules-id.yaml'
  /api/v1/scheduler/trigger:
    $ref: './paths/scheduler-trigger.yaml'
  /api/v1/notifications/device-tokens:
    $ref: './paths/notifications-device-tokens.yaml'
  /api/v1/auth/verify-phone:
    $ref: './paths/auth/verify-phone.yaml'
  /api/v1/auth/sign-out:
    $ref: './paths/auth/sign-out.yaml'
  /api/v1/auth/refresh:
    $ref: './paths/auth/refresh.yaml'

components:
  schemas:
    # Common — reusable across services
    ErrorResponse:
      $ref: './components/schemas/common/ErrorResponse.yaml'
    PageInfo:
      $ref: './components/schemas/common/PageInfo.yaml'
    PagedResponse:
      $ref: './components/schemas/common/PagedResponse.yaml'
    SchedulePeriodType:
      $ref: './components/schemas/common/SchedulePeriodType.yaml'
    # Auth
    VerifyPhoneRequest:
      $ref: './components/schemas/auth/VerifyPhoneRequest.yaml'
    VerifyPhoneResponse:
      $ref: './components/schemas/auth/VerifyPhoneResponse.yaml'
    SignOutRequest:
      $ref: './components/schemas/auth/SignOutRequest.yaml'
    RefreshTokenRequest:
      $ref: './components/schemas/auth/RefreshTokenRequest.yaml'
    RefreshTokenResponse:
      $ref: './components/schemas/auth/RefreshTokenResponse.yaml'
    # Users
    CreateUserRequest:
      $ref: './components/schemas/users/CreateUserRequest.yaml'
    UpdateUserRequest:
      $ref: './components/schemas/users/UpdateUserRequest.yaml'
    UserResponse:
      $ref: './components/schemas/users/UserResponse.yaml'
    # Accounts
    AccountType:
      $ref: './components/schemas/accounts/AccountType.yaml'
    CreateAccountRequest:
      $ref: './components/schemas/accounts/CreateAccountRequest.yaml'
    AccountResponse:
      $ref: './components/schemas/accounts/AccountResponse.yaml'
    AccountListResponse:
      $ref: './components/schemas/accounts/AccountListResponse.yaml'
    UpdateAccountRequest:
      $ref: './components/schemas/accounts/UpdateAccountRequest.yaml'
    # Goals
    GoalStatus:
      $ref: './components/schemas/goals/GoalStatus.yaml'
    CreateGoalRequest:
      $ref: './components/schemas/goals/CreateGoalRequest.yaml'
    GoalResponse:
      $ref: './components/schemas/goals/GoalResponse.yaml'
    GoalListResponse:
      $ref: './components/schemas/goals/GoalListResponse.yaml'
    UpdateGoalRequest:
      $ref: './components/schemas/goals/UpdateGoalRequest.yaml'
    GoalAllocationRuleRequest:
      $ref: './components/schemas/goals/GoalAllocationRuleRequest.yaml'
    GoalAllocationRuleResponse:
      $ref: './components/schemas/goals/GoalAllocationRuleResponse.yaml'
    UpdateGoalOrderRequest:
      $ref: './components/schemas/goals/UpdateGoalOrderRequest.yaml'
    GoalTransactionType:
      $ref: './components/schemas/goals/GoalTransactionType.yaml'
    GoalTransactionResponse:
      $ref: './components/schemas/goals/GoalTransactionResponse.yaml'
    GoalTransactionListResponse:
      $ref: './components/schemas/goals/GoalTransactionListResponse.yaml'
    # Budgets
    BudgetStatus:
      $ref: './components/schemas/budgets/BudgetStatus.yaml'
    BudgetPeriodType:
      $ref: './components/schemas/budgets/BudgetPeriodType.yaml'
    BudgetCarryoverPolicy:
      $ref: './components/schemas/budgets/BudgetCarryoverPolicy.yaml'
    CreateBudgetRequest:
      $ref: './components/schemas/budgets/CreateBudgetRequest.yaml'
    UpdateBudgetRequest:
      $ref: './components/schemas/budgets/UpdateBudgetRequest.yaml'
    BudgetResponse:
      $ref: './components/schemas/budgets/BudgetResponse.yaml'
    BudgetListResponse:
      $ref: './components/schemas/budgets/BudgetListResponse.yaml'
    CreateBudgetTransactionRequest:
      $ref: './components/schemas/budgets/CreateBudgetTransactionRequest.yaml'
    BudgetAuditField:
      $ref: './components/schemas/budgets/BudgetAuditField.yaml'
    BudgetAuditLogEntryResponse:
      $ref: './components/schemas/budgets/BudgetAuditLogEntryResponse.yaml'
    BudgetAuditLogListResponse:
      $ref: './components/schemas/budgets/BudgetAuditLogListResponse.yaml'
    BudgetPeriodHistoryResponse:
      $ref: './components/schemas/budgets/BudgetPeriodHistoryResponse.yaml'
    BudgetPeriodHistoryListResponse:
      $ref: './components/schemas/budgets/BudgetPeriodHistoryListResponse.yaml'
    # Icons
    MasterIconResponse:
      $ref: './components/schemas/icons/MasterIconResponse.yaml'
    # Transactions
    TransactionType:
      $ref: './components/schemas/transactions/TransactionType.yaml'
    CreateTransactionRequest:
      $ref: './components/schemas/transactions/CreateTransactionRequest.yaml'
    TransactionResponse:
      $ref: './components/schemas/transactions/TransactionResponse.yaml'
    TransactionListResponse:
      $ref: './components/schemas/transactions/TransactionListResponse.yaml'
    UpdateTransactionRequest:
      $ref: './components/schemas/transactions/UpdateTransactionRequest.yaml'
    RecurringTransactionRuleRequest:
      $ref: './components/schemas/transactions/RecurringTransactionRuleRequest.yaml'
    RecurringTransactionRuleResponse:
      $ref: './components/schemas/transactions/RecurringTransactionRuleResponse.yaml'
    RecurringTransactionRuleListResponse:
      $ref: './components/schemas/transactions/RecurringTransactionRuleListResponse.yaml'
    UpdateRecurringTransactionRuleRequest:
      $ref: './components/schemas/transactions/UpdateRecurringTransactionRuleRequest.yaml'
    # Notifications
    DevicePlatform:
      $ref: './components/schemas/notifications/DevicePlatform.yaml'
    RegisterDeviceTokenRequest:
      $ref: './components/schemas/notifications/RegisterDeviceTokenRequest.yaml'
    DeviceTokenResponse:
      $ref: './components/schemas/notifications/DeviceTokenResponse.yaml'
  responses:
    UnauthorizedResponse:
      $ref: './components/responses/UnauthorizedResponse.yaml'
    InternalServerErrorResponse:
      $ref: './components/responses/InternalServerErrorResponse.yaml'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

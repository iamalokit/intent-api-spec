type: object
required:
  - accountId
  - type
  - amount
  - title
properties:
  accountId:
    type: string
    format: uuid
    description: ID of the account this transaction belongs to
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  type:
    $ref: './TransactionType.yaml'
  amount:
    type: number
    format: double
    minimum: 0.01
    description: Transaction amount
    example: 1500.00
  currency:
    type: string
    minLength: 3
    maxLength: 3
    default: INR
    description: ISO 4217 currency code
    example: INR
  title:
    type: string
    minLength: 1
    maxLength: 50
    description: Short title for the transaction
    example: Grocery run
  description:
    type: string
    maxLength: 255
    description: Optional note or label for the transaction
    example: Monthly grocery shopping
  budgetId:
    type: string
    format: uuid
    description: ID of an existing budget to categorise this DEBIT transaction under
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  transactionDate:
    type: string
    format: date
    description: Date when the transaction occurred (YYYY-MM-DD). Defaults to today if not provided.
    example: '2026-06-27'
  recurringRule:
    $ref: './RecurringTransactionRuleRequest.yaml'
  receiptKey:
    type: string
    maxLength: 255
    description: >
      Storage key of a receipt image previously uploaded via
      `POST /api/v1/transactions/receipt-upload-url`. Must be a pending key
      belonging to the authenticated user; it is promoted to permanent storage
      as part of creating the transaction. Omit when there is no receipt.
    example: pending/7c9e6679-7425-40de-944b-e07fc1f90ae7/3f1c2d49-1b74-e5ab-c348-f72e1d09abcd.jpg

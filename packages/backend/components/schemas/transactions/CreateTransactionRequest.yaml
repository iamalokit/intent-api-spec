type: object
required:
  - accountId
  - type
  - amount
  - title
properties:
  accountId:
    type: string
    format: uuid
    description: ID of the account this transaction belongs to
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  type:
    $ref: './TransactionType.yaml'
  amount:
    type: number
    format: double
    minimum: 0.01
    description: Transaction amount
    example: 1500.00
  currency:
    type: string
    minLength: 3
    maxLength: 3
    default: INR
    description: ISO 4217 currency code
    example: INR
  title:
    type: string
    minLength: 1
    maxLength: 50
    description: Short title for the transaction
    example: Grocery run
  description:
    type: string
    maxLength: 255
    description: Optional note or label for the transaction
    example: Monthly grocery shopping
  budgetId:
    type: string
    format: uuid
    description: ID of an existing budget to categorise this DEBIT transaction under
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  transactionDate:
    type: string
    format: date
    description: Date when the transaction occurred (YYYY-MM-DD). Defaults to today if not provided.
    example: '2026-06-27'

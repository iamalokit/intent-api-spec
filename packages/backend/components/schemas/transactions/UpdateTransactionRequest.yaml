type: object
properties:
  accountId:
    type: string
    format: uuid
    description: ID of the account to reassign this transaction to
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  amount:
    type: number
    format: double
    minimum: 0.01
    description: Corrected transaction amount
    example: 2000.00
  title:
    type: string
    maxLength: 50
    description: Updated short title for the transaction
    example: Grocery run — corrected
  description:
    type: string
    maxLength: 255
    description: Updated note or label for the transaction
    example: Monthly grocery shopping — corrected
  transactionDate:
    type: string
    format: date
    description: Corrected date when the transaction occurred (YYYY-MM-DD).
    example: '2026-06-27'

type: object
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the transaction
    example: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
  accountId:
    type: string
    format: uuid
    description: ID of the account this transaction belongs to
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  budgetId:
    type: string
    format: uuid
    description: ID of the budget this transaction is categorised under, if any
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  type:
    $ref: './TransactionType.yaml'
  amount:
    type: number
    format: double
    description: Transaction amount
    example: 1500.00
  currency:
    type: string
    description: ISO 4217 currency code
    example: INR
  title:
    type: string
    maxLength: 50
    description: Short title for the transaction
    example: Grocery run
  description:
    type: string
    description: Optional note or label for the transaction
    example: Monthly grocery shopping
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the transaction was recorded
    example: '2026-06-19T10:30:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when the transaction was last updated
    example: '2026-06-19T10:30:00Z'

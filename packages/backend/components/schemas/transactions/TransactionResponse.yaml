type: object
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the transaction
    example: a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc
  accountId:
    type: string
    format: uuid
    description: ID of the account this transaction belongs to
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  budgetId:
    type: string
    format: uuid
    description: ID of the budget this transaction is categorised under, if any
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  type:
    $ref: './TransactionType.yaml'
  amount:
    type: number
    format: double
    description: Transaction amount
    example: 1500.00
  currency:
    type: string
    description: ISO 4217 currency code
    example: INR
  title:
    type: string
    maxLength: 50
    description: Short title for the transaction
    example: Grocery run
  description:
    type: string
    description: Optional note or label for the transaction
    example: Monthly grocery shopping
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the transaction was recorded
    example: '2026-06-19T10:30:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when the transaction was last updated
    example: '2026-06-19T10:30:00Z'
  recurringRule:
    allOf:
      - $ref: './RecurringTransactionRuleResponse.yaml'
    type: object
    nullable: true
    description: Recurring schedule this transaction originated, if any
  receiptKey:
    type: string
    maxLength: 255
    nullable: true
    description: >
      Stable storage key of the attached receipt image, or null when the
      transaction has no receipt. Echo this value back on update to keep the
      existing receipt.
    example: receipts/7c9e6679-7425-40de-944b-e07fc1f90ae7/a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc/3f1c2d49.jpg
  receiptUrl:
    type: string
    format: uri
    nullable: true
    description: >
      Short-lived presigned URL for viewing the receipt image, or null when
      the transaction has no receipt. Expires roughly 15 minutes after the
      response is issued and differs on every request, so it must not be
      persisted or used as a cache key.
    example: https://silver-receipts-dev.s3.ap-south-1.amazonaws.com/receipts/7c9e6679-7425-40de-944b-e07fc1f90ae7/a3f1c2d4-91b7-4e5a-bc34-8f72e1d09abc/3f1c2d49.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256

type: object
required:
  - contentType
  - contentLength
properties:
  contentType:
    type: string
    enum:
      - image/jpeg
      - image/png
    description: >
      MIME type of the image about to be uploaded. Signed into the presigned
      URL, so an upload declaring a different `Content-Type` is rejected by
      the storage service.
    example: image/jpeg
  contentLength:
    type: integer
    format: int64
    minimum: 1
    maximum: 10485760
    description: >
      Exact size in bytes of the image about to be uploaded. Also signed into
      the presigned URL, so a client cannot declare a small image and then
      stream a large one. Capped at 10 MB.
    example: 248312

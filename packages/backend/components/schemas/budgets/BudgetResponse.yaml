type: object
additionalProperties: false
required:
  - id
  - name
  - periodType
  - amount
  - startDate
  - status
  - carryoverPolicy
  - carryoverAmount
  - effectiveAmount
  - createdAt
  - spentAmount
  - carryoverSpent
  - updatedAt
  - iconId
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the budget
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  name:
    type: string
    description: Display name of the budget
    example: Groceries
  periodType:
    $ref: './BudgetPeriodType.yaml'
  amount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Maximum spend allowed for the period. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '10000.00'
  startDate:
    type: string
    format: date
    description: Date from which the first budget period begins
    example: '2026-06-01'
  status:
    $ref: './BudgetStatus.yaml'
  carryoverPolicy:
    $ref: './BudgetCarryoverPolicy.yaml'
  carryoverAmount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Accumulated unspent balance carried forward from previous periods. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '2000.00'
  effectiveAmount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Effective budget limit for the current period (amount + carryoverAmount). Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '12000.00'
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the budget was created
    example: '2026-06-14T09:00:00Z'
  spentAmount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Total DEBIT amount spent against this budget. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '3500.00'
  carryoverSpent:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Portion of carryoverAmount spent so far in the current period (min(spentAmount, carryoverAmount)). Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '1500.00'
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when the budget was last updated
    example: '2026-06-14T09:00:00Z'
  iconId:
    type: string
    format: uuid
    nullable: true
    description: Identifier of the selected icon from the master icon catalog
    example: 99429136-66ff-4b98-9335-e8edce6e9a51

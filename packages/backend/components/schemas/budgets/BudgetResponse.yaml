type: object
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the budget
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  name:
    type: string
    description: Display name of the budget
    example: Groceries
  periodType:
    $ref: './BudgetPeriodType.yaml'
  amount:
    type: number
    format: double
    description: Maximum spend allowed for the period
    example: 10000.00
  startDate:
    type: string
    format: date
    description: Date from which the first budget period begins
    example: '2026-06-01'
  isActive:
    type: boolean
    description: Whether the budget is currently active
    example: true
  carryoverPolicy:
    $ref: './BudgetCarryoverPolicy.yaml'
  carryoverAmount:
    type: number
    format: double
    description: Accumulated unspent balance carried forward from previous periods
    example: 2000.00
  effectiveAmount:
    type: number
    format: double
    description: Effective budget limit for the current period (amount + carryoverAmount)
    example: 12000.00
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the budget was created
    example: '2026-06-14T09:00:00Z'
  spentAmount:
    type: number
    format: double
    description: Total DEBIT amount spent against this budget
    example: 3500.00
  carryoverSpent:
    type: number
    format: double
    description: Portion of carryoverAmount spent so far in the current period (min(spentAmount, carryoverAmount))
    example: 1500.00
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when the budget was last updated
    example: '2026-06-14T09:00:00Z'

type: object
required:
  - name
  - periodType
  - amount
  - startDate
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Display name of the budget
    example: Groceries
  periodType:
    $ref: './BudgetPeriodType.yaml'
  amount:
    type: number
    format: double
    minimum: 1
    description: Maximum spend allowed for the period
    example: 10000.00
  startDate:
    type: string
    format: date
    description: Date from which the first budget period begins (YYYY-MM-DD)
    example: '2026-06-01'
  carryoverPolicy:
    $ref: './BudgetCarryoverPolicy.yaml'

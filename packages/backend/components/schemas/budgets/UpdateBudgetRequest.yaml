type: object
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Display name of the budget
    example: Groceries
  periodType:
    $ref: './BudgetPeriodType.yaml'
  amount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Maximum spend allowed for the period. Must be at least 1.00. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '12000.00'
  startDate:
    type: string
    format: date
    description: Date from which the budget period begins (YYYY-MM-DD)
    example: '2026-07-01'
  status:
    $ref: './BudgetStatus.yaml'
  carryoverPolicy:
    $ref: './BudgetCarryoverPolicy.yaml'
  iconId:
    type: string
    format: uuid
    description: Identifier of the selected icon from the master icon catalog
    example: 99429136-66ff-4b98-9335-e8edce6e9a51

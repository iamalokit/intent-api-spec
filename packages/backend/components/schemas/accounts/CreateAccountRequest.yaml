type: object
additionalProperties: false
required:
  - accountName
  - accountType
properties:
  accountName:
    type: string
    minLength: 1
    maxLength: 100
    description: Display name of the account
    example: HDFC Savings
  accountType:
    $ref: './AccountType.yaml'
  currentBalance:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Known balance at time of creation. Omit if unknown. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '25000.00'
  balanceSource:
    type: string
    enum: [MANUAL, BANK_SYNC]
    description: How the balance was obtained. Required when currentBalance is provided.
    example: MANUAL

type: object
additionalProperties: false
properties:
  accountName:
    type: string
    minLength: 1
    maxLength: 100
    description: Display name of the account
    example: HDFC Savings
  accountType:
    $ref: './AccountType.yaml'
  currentBalance:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Updated balance of the account. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '30000.00'
  balanceSource:
    $ref: './BalanceSource.yaml'

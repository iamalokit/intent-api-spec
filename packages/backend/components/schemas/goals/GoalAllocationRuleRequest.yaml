type: object
required:
  - triggerType
  - ruleType
properties:
  triggerType:
    $ref: './TriggerType.yaml'
  schedulePeriodType:
    $ref: './SchedulePeriodType.yaml'
  startDate:
    type: string
    format: date
    description: >-
      Date the SCHEDULED plan should start from — the first execution is computed
      from this date instead of the current date. A past or omitted value falls
      back to starting from now.
    example: '2026-08-01'
  ruleType:
    type: string
    maxLength: 50
    description: Type of allocation calculation (e.g. FIXED_AMOUNT)
    example: FIXED_AMOUNT
  fixedAmount:
    type: number
    format: double
    minimum: 0
    description: Fixed amount to allocate (required when ruleType is FIXED_AMOUNT)
    example: 5000.00
  enabled:
    type: boolean
    default: true
    description: Whether this allocation rule is active
    example: true

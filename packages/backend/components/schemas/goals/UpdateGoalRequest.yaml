type: object
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Name of the saving goal
    example: Emergency Fund
  targetAmount:
    type: number
    minimum: 1
    description: Target amount to save
    example: 50000
  currentAmount:
    type: number
    minimum: 0
    description: Amount already saved towards this goal
    example: 12000
  targetDate:
    type: string
    format: date
    description: Target date to reach the goal (YYYY-MM-DD)
    example: '2026-12-31'
  notes:
    type: string
    maxLength: 500
    description: Optional notes or description
    example: 6 months of living expenses
  status:
    $ref: './GoalStatus.yaml'
  allocationRule:
    $ref: './GoalAllocationRuleRequest.yaml'

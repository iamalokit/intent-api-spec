type: object
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Name of the saving goal
    example: Emergency Fund
  targetAmount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Target amount to save. Must be at least 1.00. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '50000.00'
  currentAmount:
    type: string
    pattern: '^\d{1,15}\.\d{2}$'
    description: Amount already saved towards this goal. Represented as a string to avoid floating-point precision loss; always exactly 2 decimal places.
    example: '12000.00'
  targetDate:
    type: string
    format: date
    description: Target date to reach the goal (YYYY-MM-DD)
    example: '2026-12-31'
  notes:
    type: string
    maxLength: 500
    description: Optional notes or description
    example: 6 months of living expenses
  order:
    type: integer
    minimum: 0
    description: Display order of the goal
    example: 1
  status:
    $ref: './GoalStatus.yaml'
  allocationRule:
    $ref: './GoalAllocationRuleRequest.yaml'
  iconId:
    type: string
    format: uuid
    description: Identifier of the selected icon from the master icon catalog
    example: 5b39aeaa-441b-4e17-9803-11eef70ab9ee

description: Too Many Requests — the client has exceeded the allowed request rate
headers:
  Retry-After:
    description: Number of seconds to wait before retrying the request.
    schema:
      type: integer
      example: 30
  X-RateLimit-Limit:
    description: Maximum number of requests allowed in the current rate-limit window.
    schema:
      type: integer
      example: 100
  X-RateLimit-Remaining:
    description: Number of requests remaining in the current rate-limit window.
    schema:
      type: integer
      example: 0
  X-RateLimit-Reset:
    description: Unix timestamp (seconds) at which the current rate-limit window resets.
    schema:
      type: integer
      example: 1735689600
content:
  application/json:
    schema:
      $ref: '../schemas/common/ErrorResponse.yaml'
    example:
      status: 429
      error: Too Many Requests
      message: Rate limit exceeded. Please retry after the window indicated by the Retry-After header.
      code: RATE_LIMIT_EXCEEDED
      traceId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
